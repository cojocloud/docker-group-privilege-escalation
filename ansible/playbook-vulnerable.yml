---
# playbook-vulnerable.yml
#
# Provisions Docker and a low-privileged "dev_user" account, then introduces
# the misconfiguration this lab is built around: adding dev_user to the
# docker group. On a default Docker install, the docker group is root-
# equivalent — the daemon it talks to runs as root with no further
# authorization checks. This simulates configuration drift where a
# well-intentioned "let the dev team manage their own containers" change
# quietly grants host root.
#
# MITRE ATT&CK: T1611 (Escape to Host)

- name: Configure vulnerable Docker host (T1611 lab)
  hosts: lab
  become: true

  vars:
    dev_user: dev_user

  tasks:
    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present
        update_cache: true

    - name: Ensure Docker service is running and enabled
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Create low-privileged dev_user account
      user:
        name: "{{ dev_user }}"
        shell: /bin/bash
        create_home: true
        state: present

    # --- THE DELIBERATE FLAW ---------------------------------------------
    # This is the misconfiguration the whole lab exists to demonstrate.
    # Membership in the docker group is equivalent to passwordless root:
    # any member can bind-mount the host filesystem into a container and
    # chroot into it. Do not do this in a real environment — see
    # playbook-harden.yml for the fix.
    - name: "[VULNERABLE] Add dev_user to the docker group"
      user:
        name: "{{ dev_user }}"
        groups: docker
        append: true
    # -----------------------------------------------------------------------

    - name: Copy the exploit script onto the host for the demo
      copy:
        src: ../exploit/docker_group_escape.sh
        dest: "/home/{{ dev_user }}/docker_group_escape.sh"
        owner: "{{ dev_user }}"
        group: "{{ dev_user }}"
        mode: "0755"
